unit_tests:
  # Smallest possible fixture that exposes the fan-out: ONE order, and a
  # customer dimension holding TWO active rows for that same customer.
  #
  # The join in fct_daily_revenue matches the order against both dimension
  # rows, so the single 100.0 order is counted twice. No SQL error, no null,
  # no duplicate order_id - just wrong money.
  - name: duplicate_active_customer_must_not_inflate_revenue
    model: fct_daily_revenue
    description: >
      A historised customer dimension can legitimately hold several rows per
      customer. The mart must still count each order exactly once.
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, tier: silver}
          - {customer_id: C0001, is_active: true, tier: gold}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 1, daily_revenue: 100.0}

  # Guard against over-correcting: a fix that dedupes too aggressively (e.g.
  # collapsing on order_date, or an inner join dropping unmatched orders) would
  # break this ordinary case.
  - name: completed_orders_sum_to_expected_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 3, customer_id: C0002, amount_usd: 50.0, status: pending, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}
